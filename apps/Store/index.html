<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orvexa Store</title>
    <style>
        :root {
            --bg: #f3f6ff;
            --panel: #ffffff;
            --panel-2: #eef2ff;
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --accent: #8b5cf6;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 12px 30px rgba(79, 70, 229, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
            color: var(--text);
        }

        .headertextcontainer {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            min-height: 90px;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 20px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 2vw, 2.2rem);
        }

        .search-wrap {
            position: relative;
            width: min(420px, 52vw);
        }

        #searchInput {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 1rem;
            background: #f9fafb;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #searchInput:focus {
            border-color: rgba(79, 70, 229, 0.5);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
            background: #fff;
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.7;
        }

        main {
            padding: 32px 20px 60px;
        }

        .store-links {
            max-width: 700px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .store-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 96px;
            padding: 20px 24px;
            border: 1px solid rgba(79, 70, 229, 0.18);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(139, 92, 246, 0.08));
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .store-link:hover {
            transform: translateY(-2px);
            border-color: rgba(79, 70, 229, 0.32);
            box-shadow: 0 14px 28px rgba(79, 70, 229, 0.12);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 35px rgba(79, 70, 229, 0.15);
        }

        .product-image {
            display: grid;
            place-items: center;
            height: 150px;
            margin-bottom: 16px;
            border-radius: 16px;
            font-size: 3rem;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
        }

        .product-card:nth-child(2) .product-image {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
        }

        .product-card:nth-child(3) .product-image {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }

        .product-card h2 {
            margin: 0 0 10px;
            font-size: 1.3rem;
        }

        .product-card p {
            margin: 0 0 16px;
            color: var(--muted);
            line-height: 1.5;
            min-height: 48px;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .headertextcontainer {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
            }

            .brand {
                margin-right: 0;
            }

            .search-wrap {
                width: min(100%, 420px);
            }
        }
    </style>
</head>

<body>
    <header class="headertextcontainer">
        <div class="brand">
            <div class="brand-mark">O</div>
            <h1>Orvexa Store</h1>
        </div>

        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="filterProducts()">
            <span class="search-icon">🔎</span>
        </div>
    </header>

    <main>
        <nav class="store-links" aria-label="Store categories">
            <a class="store-link active" href="./apps.html">Apps Store</a>
            <a class="store-link" href="./plugins.html">App Catalog</a>
        </nav>
    </main>

    <script>
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.product-card');

            cards.forEach((card) => {
                const productName = card.dataset.name || card.querySelector('h2').textContent.toLowerCase();
                const shouldShow = productName.includes(searchTerm);
                card.classList.toggle('hidden', !shouldShow);
            });
        }

        function addToCart(name, price) {
            alert(name + ' added to cart for $' + price + '.');
        }
    </script>
</body>

</html>
