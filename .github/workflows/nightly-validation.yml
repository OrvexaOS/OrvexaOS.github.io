name: Nightly validation

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Run repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find windows apps pluginmng -type f -name '*.js' -print0 2>/dev/null; find . -maxdepth 1 -type f -name '*.js' -print0)
      - name: Validate site HTML and manifest
        run: python3 scripts/validate.py
      - name: Validate app registry JSON
        run: python3 -m json.tool apps/index.json > /dev/null
