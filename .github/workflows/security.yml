name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  secret-patterns:
    name: Check for accidental credential patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked text for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          # This lightweight scan is a backstop, not a replacement for secret scanning.
          if git grep -n -I -E '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!*.lock'; then
            echo "::error::Potential credential pattern found. Review the matches and remove any real secret."
            exit 1
          else
            echo "No common credential patterns found in tracked text."
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4