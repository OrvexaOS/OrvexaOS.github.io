name: App registry audit

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/app-registry-audit.yml"
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/app-registry-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit editable app registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate registry structure and report missing templates
        shell: python {0}
        run: |
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'apps' / 'index.json'
          try:
              registry = json.loads(registry_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'::error file=apps/index.json::Could not parse registry: {exc}')
              sys.exit(1)

          apps = registry.get('apps')
          if not isinstance(apps, list) or not apps:
              print('::error file=apps/index.json::Expected a non-empty apps array')
              sys.exit(1)

          seen = set()
          errors = []
          missing = []
          for entry in apps:
              if not isinstance(entry, dict):
                  errors.append('Each registry entry must be an object')
                  continue
              app_id = entry.get('id')
              if not isinstance(app_id, str) or not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', app_id):
                  errors.append(f'Invalid app id: {app_id!r}')
                  continue
              if app_id in seen:
                  errors.append(f'Duplicate app id: {app_id}')
              seen.add(app_id)
              for key in ('html', 'metadata'):
                  path = entry.get(key)
                  expected_prefix = f'/apps/{app_id}/'
                  if not isinstance(path, str) or not path.startswith(expected_prefix) or '..' in Path(path).parts:
                      errors.append(f'{app_id}: invalid {key} path {path!r}')
                      continue
                  file_path = root / path.lstrip('/')
                  if not file_path.is_file():
                      missing.append(f'{app_id}: {path}')

          if errors:
              for error in errors:
                  print(f'::error file=apps/index.json::{error}')
              sys.exit(1)

          print(f'Registry structure valid: {len(seen)} unique app IDs.')
          if missing:
              print(f'::warning::{len(missing)} app source file(s) referenced by the registry are missing:')
              for item in missing:
                  print(f'::warning::{item}')
          else:
              print('All registered app templates and metadata files exist.')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## App registry audit\n\n')
              summary.write(f'- Registered app IDs: **{len(seen)}**\n')
              summary.write(f'- Missing referenced files: **{len(missing)}**\n')
              if missing:
                  summary.write('\n### Missing source files\n')
                  summary.write('\n'.join(f'- {item}' for item in missing))
                  summary.write('\n')
