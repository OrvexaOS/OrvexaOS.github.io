name: Publish OrvexaOS release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find windows apps pluginmng -type f -name '*.js' -print0 2>/dev/null; find . -maxdepth 1 -type f -name '*.js' -print0)
      - name: Validate HTML and manifest
        run: python3 scripts/validate.py
      - name: Validate app registry and templates
        run: python3 scripts/validate_apps.py
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool apps/index.json > /dev/null
          python3 -m json.tool manifest.webmanifest > /dev/null

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' does not exist in this checkout."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate release notes and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --generate-notes --title "OrvexaOS $TAG" || {
            echo "Release creation failed. Check whether a release already exists for $TAG."
            exit 1
          }
          echo "Published release $TAG with GitHub-generated release notes."
