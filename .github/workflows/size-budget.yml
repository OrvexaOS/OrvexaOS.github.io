name: Repository size budget

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check large tracked files
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error file=$file::File is $size bytes; limit is $max_bytes bytes."
              failed=1
            fi
          done < <(git ls-files -z)
          if [ "$failed" -ne 0 ]; then
            echo "Repository contains files over the 5 MiB budget."
            exit 1
          fi
          echo "All tracked files are within the 5 MiB budget."