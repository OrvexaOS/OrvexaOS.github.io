name: Validate OrvexaOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find windows apps pluginmng -type f -name '*.js' -print0 2>/dev/null; find . -maxdepth 1 -type f -name '*.js' -print0)
      - name: Validate HTML references and manifest
        run: python3 scripts/validate.py
      - name: Validate app registry and every editable app source
        run: python3 scripts/validate_apps.py
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool apps/index.json > /dev/null
          python3 -m json.tool manifest.webmanifest > /dev/null